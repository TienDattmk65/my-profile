name: Core Profile CI/CD Pipeline

on:
  pull_request:
    branches: [ main, deploy ]
    paths:
      - 'apps/core-profile/**'
      - '.github/workflows/core-profile-ci.yml'
  push:
    branches: [ main, deploy ]
    paths:
      - 'apps/core-profile/**'
      - '.github/workflows/core-profile-ci.yml'


jobs:
  validate-and-build:
    name: Lint, Type-Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core-profile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/core-profile/package.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Type Check
        run: npm run type-check

      - name: Build Production Assets
        run: npm run build

  docker-validate:
    name: Dockerfile Build Test
    runs-on: ubuntu-latest
    needs: [validate-and-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image Test
        uses: docker/build-push-action@v5
        with:
          context: apps/core-profile
          file: apps/core-profile/Dockerfile
          push: false
          tags: core-profile:test

  deploy-to-render:
    name: Continuous Deployment (Render)
    runs-on: ubuntu-latest
    needs: [validate-and-build, docker-validate]
    # Chỉ chạy deploy khi sự kiện xảy ra trên nhánh deploy
    if: github.ref == 'refs/heads/deploy' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy Webhook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning ::Secret RENDER_DEPLOY_HOOK_URL chưa được cấu hình. Bỏ qua bước gọi webhook."
          else
            echo "Đang kích hoạt Render Deploy Hook..."
            curl -f -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Kích hoạt triển khai Render thành công!"
          fi
